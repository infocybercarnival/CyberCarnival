{% extends "admin/base.html" %}
{% block title %}Dashboard — CyberCarnival Coordinator{% endblock %}
{% block body %}
<meta name="csrf-token" content="{{ csrf_token() }}" />
<link rel="stylesheet" href="/static/coordinator/css/dashboard.css" />

<div class="shell">
  <header class="topbar">
    <div class="auth-brand">CYBERCARNIVAL<span>/ COORDINATOR</span></div>
    <div class="topbar-right">
      <span class="who">{{ coordinator_username }}</span>
      <form method="post" action="{{ url_for('coordinator_auth.logout') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
        <button type="submit" class="btn-ghost">Log out</button>
      </form>
    </div>
  </header>

  <main class="coord-shell" id="coordinator-main">
    <div class="coord-intro">
      <h2>Your Events</h2>
      <p>Only the event(s) assigned to you appear here.</p>
    </div>
    <div id="events-list">
      <div class="skeleton skeleton-card"></div>
    </div>
  </main>
</div>

<div id="toast-stack"></div>

<script src="/static/coordinator/js/dashboard.js"></script>
{% endblock %}
